services:
  postgres:
    image: postgres:17-alpine
    container_name: householdmanager-postgres
    environment:
      POSTGRES_DB: householdmanager
      POSTGRES_USER: household
      POSTGRES_PASSWORD: household
    ports:
      # Host-Port ist überschreibbar, falls 5432 lokal belegt ist:
      #   POSTGRES_PORT=15432 docker compose -f compose.yml up -d postgres
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - household-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household -d householdmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: householdmanager-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/householdmanager
      DB_USER: household
      DB_PASSWORD: household
    # Die lokale Konfiguration (Secrets) wird nicht ins Image kopiert,
    # sondern read-only eingebunden. Fehlt die Datei, startet der Container
    # ohne Authentifizierung (siehe Backend-Log).
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # Das Image enthält kein curl/wget, aber bash — damit prüfen wir, ob
      # der Port offen ist (die Anwendung öffnet ihn erst, wenn Flyway und
      # JPA fertig sind).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: householdmanager-frontend
    depends_on:
      # nginx löst den Upstream „backend" beim Start auf: ohne Wartezeit
      # bricht der Container mit „host not found in upstream backend" ab.
      backend:
        condition: service_healthy
    ports:
      # nginx lauscht intern auf Port 80
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  household-db:
