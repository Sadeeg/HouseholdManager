<section class="login">
  <div class="login__panel">
    <p class="login__eyebrow">household-manager</p>
    <h1 class="login__title">Anmelden</h1>
    <p class="login__hint">
      Die Anmeldung läuft über deinen Nextcloud-Account. Es werden keine
      Passwörter in dieser Anwendung gespeichert.
    </p>

    <button type="button" class="login__action" (click)="login()">
      Mit Nextcloud anmelden
    </button>

    @if (error(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <p class="login__note">
      Noch kein Zugang? Ein Konto wird von der Administration im Nextcloud
      eingerichtet.
    </p>
  </div>
</section>
