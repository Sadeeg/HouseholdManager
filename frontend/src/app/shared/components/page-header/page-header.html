<header class="page-header">
  <div class="page-header__heading">
    <h2 class="page-header__title">{{ title() }}</h2>
    @if (subtitle(); as text) {
      <p class="page-header__subtitle">{{ text }}</p>
    }
  </div>
  <div class="page-header__actions">
    <ng-content select="[actions]" />
  </div>
</header>
