spring:
  application:
    name: household-manager

  datasource:
    # Überschreibbar per Umgebungsvariable; Defaults sind die lokalen
    # Dev-Werte aus compose.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/householdmanager}
    username: ${DB_USER:household}
    password: ${DB_PASSWORD:household}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Dev Services (spring-boot-docker-compose) sind ab Boot 4 aktiv, sobald die
  # Abhängigkeit im Classpath liegt. Ohne Compose-Datei bricht der Start —
  # deshalb standardmäßig aus, nur im Profil "local" an.
  docker:
    compose:
      enabled: false

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
