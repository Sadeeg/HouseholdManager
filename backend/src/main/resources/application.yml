spring:
  application:
    name: household-manager

  # Lokale Konfiguration aus .env (steht in .gitignore). Fehlt die Datei,
  # startet die Anwendung mit den Defaults aus dieser Datei.
  # Relative Pfade decken beide Startverzeichnisse ab (Repo-Root und backend/).
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    # Überschreibbar per Umgebungsvariable; Defaults sind die lokalen
    # Dev-Werte aus compose.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/householdmanager}
    username: ${DB_USER:household}
    password: ${DB_PASSWORD:household}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Dev Services (spring-boot-docker-compose) sind ab Boot 4 aktiv, sobald die
  # Abhängigkeit im Classpath liegt. Ohne Compose-Datei bricht der Start —
  # deshalb standardmäßig aus, nur im Profil "local" an.
  docker:
    compose:
      enabled: false

  threads:
    virtual:
      enabled: true

server:
  port: 8080

# --- Nextcloud ---
# Werte kommen aus .env (siehe .env.example). Ohne die Datei bleibt alles
# leer: der Nutzerverzeichnis-Adapter ist dann deaktiviert.
nextcloud:
  base-url: ${NEXTCLOUD_BASE_URL:}
  admin-user: ${NEXTCLOUD_ADMIN_USER:}
  admin-app-password: ${NEXTCLOUD_ADMIN_APP_PASSWORD:}
  oidc:
    # Issuer des Nextcloud-OIDC: das Backend validiert die JWT-Access-Tokens
    # über dessen JWKS. Kein Client-Secret nötig.
    issuer-uri: ${NEXTCLOUD_OIDC_ISSUER:}
    # Client-ID des Frontend-Clients (öffentlich, kein Secret). Damit wird
    # geprüft, für welchen Client ein Token ausgestellt wurde — ohne sie
    # würde ein Token jedes anderen Clients desselben Issuers passen.
    client-id: ${NEXTCLOUD_OIDC_CLIENT_ID:}

householdmanager:
  security:
    # Origin des Frontends (CORS). Weitere Origins per Komma trennen.
    allowed-origins: ${HOUSEHOLDMANAGER_ALLOWED_ORIGINS:http://localhost:4200}
  waste:
    # Tageslauf über alle Haushalte mit Quelle (R4, ADR 0005). Der Zeitpunkt
    # ist für den Nutzer nicht einstellbar (Annahme 1).
    sync-cron: ${HOUSEHOLDMANAGER_WASTE_SYNC_CRON:0 0 3 * * *}
    sync-zone: ${HOUSEHOLDMANAGER_WASTE_SYNC_ZONE:Europe/Berlin}
    # Abruf der öffentlichen Quelle; ein hängender Entsorger darf den Lauf und
    # das Speichern nicht blockieren (Annahme 7).
    timeout: ${HOUSEHOLDMANAGER_WASTE_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
